# SPDX-License-Identifier: EUPL-1.2
#
# The benchmarks, by hand and weekly, on the release build.  It holds no rule: they are in
# scripts/bench.py, and docs/performance.md describes them.  It publishes nothing and is
# outside the release path: the figures are the run's artifact.
name: Bench

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-bench-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - run: nix develop .#bench -c make bench
      # The corpora are measured, and both files kept, even when the estates fail.
      - if: ${{ !cancelled() }}
        run: nix develop .#bench -c make bench-corpora
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          path: |
            target/bench/results.json
            target/bench/corpora.json
          if-no-files-found: ignore
